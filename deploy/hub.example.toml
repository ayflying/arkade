# Arkade Hub 示例配置（复制为 config.toml 后按需修改）
#
# 启动：./arkade-hub -c config.toml
# 或先生成模板：./arkade-hub -init-config -c config.toml

[server]
# HTTP 监听地址
addr = "0.0.0.0:8080"
# 对外访问地址（用于前端与文档展示）
base_url = "http://127.0.0.1:8080"
timeout = "30s"

[database]
# 首期 SQLite 单实例（决策 D-03），父目录不存在会自动创建
path = "./data/hub.db"

[auth]
# 登录会话有效期，支持 30m / 24h / 72h 这类写法
session_ttl = "72h"
# Agent 反向连接使用的预共享 Token，至少 16 位。
#
# 【安全约定】必须留空，用环境变量 ARKADE_AGENT_TOKEN 注入。
# 原因：配置文件会被备份、复制到其他机器、被批量下发，令牌写进去等于
# 同时泄露到所有副本；环境变量只存在于进程环境中，不会随文件扩散。
# 生成方式示例：openssl rand -hex 24
agent_token = ""
# 首次启动创建的管理员账号。密码至少 8 位，不提供默认值。
# 【安全约定】同样留空，用环境变量 ARKADE_INITIAL_PASS 传入。
initial_user = "admin"
initial_pass = ""

[web]
# 前端构建产物目录（web/dist）。留空则不托管前端，只提供 API。
dist = "./web/dist"
