# 独立 Agent 部署：在受管服务器运行，不会同时启动 Hub。
# 将 agent.env.example 复制为同目录 .env，填写网页生成的专属密钥与可达 Hub 地址。
# 镜像必须先在本机构建或从你自己的可信仓库取得；不假设存在公开镜像。
#
# 规范同 Hub 编排：只有凭据（ARKADE_AGENT_TOKEN）从 .env 读取，
# 其余普通参数（名字、日志级别等）在本文件里直接写值。
# 注意：compose 会自动读取本项目目录的 .env，即下方 .env 的那一份，
# 因此不要把同目录 Hub 演示环境的 .env 覆盖过来。
services:
  agent:
    image: arkade-agent:debug
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ---- 必填凭据 ----
      ARKADE_AGENT_TOKEN: ${ARKADE_AGENT_TOKEN:?请填写添加服务器时生成的专属接入密钥}
      # ---- 必填参数：Hub 地址因机器而异，仍需在此指定 ----
      ARKADE_HUB_URL: ${ARKADE_AGENT_HUB_URL:?请填写可从此服务器访问的Hub WebSocket地址}
      # ---- 普通参数：直接写值 ----
      ARKADE_AGENT_NAME: arkade-node
      ARKADE_DATA_DIR: /opt/arkade/agent
      # 留空表示自动发现（$DOCKER_HOST → docker.sock → podman.sock）
      ARKADE_SOCKET: ""
      ARKADE_RUNTIME_KIND: auto
      ARKADE_HEARTBEAT_SEC: "15"
      ARKADE_LOG_LEVEL: info
      ARKADE_LOG_FORMAT: text
    volumes:
      - agent-data:/opt/arkade/agent
      # CLI要求配置文件存在；其中不保存密钥，实际值来自上方environment。
      - ./agent.config.toml:/opt/arkade/agent/agent.toml:ro
      # Docker socket赋予宿主机高权限，仅部署到可信的受管服务器。
      # 套接字不在默认位置时，改这一行（例如 /run/podman/podman.sock）。
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  agent-data:
