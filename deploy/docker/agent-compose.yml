# Agent 独立部署；只将执行面连接到可信宿主机的 Docker socket。
# 在部署目录显式使用 --env-file .env；不读取或挂载 TOML。
name: arkade-agent

services:
  agent:
    image: ayflying/arkade-agent:latest
    container_name: arkade-agent
    restart: unless-stopped
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN:?请在 .env 填写网页生成的 Agent 专属密钥}
      HUB_URL: http://请填写Hub地址:8080
      AGENT_NAME: arkade-node
      # 内部数据路径固定，避免仅改变量而脱离持久卷。
      DATA_DIR: /opt/arkade/agent
      SOCKET: /var/run/docker.sock
      RUNTIME_KIND: auto
      HEARTBEAT_SEC: 15
      LOG_LEVEL: info
      LOG_FORMAT: text
    volumes:
      - agent-data:/opt/arkade/agent
      # 等价于宿主机高权限；远程服务器只需 Agent，不重复启动 Hub。
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - arkade

volumes:
  agent-data:
    name: arkade-agent-data

networks:
  arkade:
    name: arkade-agent-net
