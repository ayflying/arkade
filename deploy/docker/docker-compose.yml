# Arkade 容器编排（Hub + Agent）
#
# 凭据只在编排层出现：全部通过同目录下的 .env 注入进容器环境变量，
# 程序配置文件里一律留空。这样凭据只有一处来源，不会散落在多个文件里。
#
# 用法（在仓库根目录）：
#   cp deploy/docker/.env.example deploy/docker/.env    # 填两个凭据
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
#   浏览器打开 http://<机器IP>:${ARKADE_HUB_PORT:-8080}
#
# 说明：compose 会自动读取与本文件同目录的 .env，
# 因此不需要每次都手写 --env-file（少一个容易漏的参数）。
#
# 清理：
#   docker compose -f deploy/docker/docker-compose.yml down -v --rmi local

name: arkade-debug

services:
  hub:
    build:
      # 构建上下文是仓库根目录：hub 依赖共享的 protocol 模块，且要打包前端产物。
      context: ../..
      dockerfile: hub/Dockerfile
      args:
        VERSION: ${ARKADE_VERSION:-0.1.0}
    image: arkade-hub:debug
    container_name: arkade-hub-debug
    restart: unless-stopped
    ports:
      - "${ARKADE_HUB_PORT:-8080}:8080"
    # env_file 与下面的 environment 的区别：
    #   env_file 把文件里的全部键值注入容器；
    #   environment 里的 ${VAR} 由 compose 在宿主侧解析后写入。
    # 两者都需要：前者保证 .env 里新增的变量也能进容器，
    # 后者用 :? 语法在宿主侧做必填校验，缺凭据时直接拒绝启动而不是带空令牌跑起来。
    env_file:
      - .env
    environment:
      # 必填校验：缺这两项时 compose 会中止并给出提示，不会静默启动一个没有凭据的容器。
      ARKADE_INITIAL_PASS: ${ARKADE_INITIAL_PASS:?必须在 deploy/docker/.env 里设置 ARKADE_INITIAL_PASS}
      ARKADE_AGENT_TOKEN: ${ARKADE_AGENT_TOKEN:?必须在 deploy/docker/.env 里设置 ARKADE_AGENT_TOKEN}
      # 覆盖配置里的监听地址：容器内必须监听 0.0.0.0 才能被端口映射访问。
      ARKADE_LISTEN: 0.0.0.0:8080
    volumes:
      - hub-data:/data
      - ./hub.config.toml:/data/config.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - arkade

  agent:
    build:
      context: ../..
      dockerfile: agent/Dockerfile
      args:
        VERSION: ${ARKADE_VERSION:-0.1.0}
    image: arkade-agent:debug
    container_name: arkade-agent-debug
    restart: unless-stopped
    depends_on:
      hub:
        # 等 Hub 真正健康再起 Agent，避免开局进入重连退避循环刷日志。
        condition: service_healthy
    env_file:
      - .env
    environment:
      ARKADE_AGENT_TOKEN: ${ARKADE_AGENT_TOKEN:?必须在 deploy/docker/.env 里设置 ARKADE_AGENT_TOKEN}
    volumes:
      - agent-data:/opt/arkade/agent
      - ./agent.config.toml:/opt/arkade/agent/agent.toml:ro
      # 挂载宿主机 Docker 套接字：Agent 必须通过它操作本机容器。
      # 这是调试专用的「同机自管」形态，生产环境不会这样部署。
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - arkade

volumes:
  hub-data:
    name: arkade-debug-hub-data
  agent-data:
    name: arkade-debug-agent-data

networks:
  arkade:
    name: arkade-debug-net
