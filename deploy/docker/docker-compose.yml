# Arkade 容器编排（Hub + Agent）
#
# 【编排规范】所有可配置项都收敛到本文件，取值一律用 ${VAR} 形式从环境变量读取，
# 实际值放在同目录的 .env 里。程序配置文件（*.config.toml）不再承载任何可配置项，
# 只保留内置默认值，全部由下面的 ${} 覆盖。
#
# 这样做的原因：
#   - 换环境只改 .env，不用去改多个 toml 再重新构建；
#   - 凭据只有一处来源，不会散落在多个文件里；
#   - 每个变量的默认值与是否必填，在本文件里一眼可见。
#
# 用法（在仓库根目录）：
#   cp deploy/docker/.env.example deploy/docker/.env    # 按需修改
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
#   浏览器打开 http://<机器IP>:${ARKADE_HUB_PORT:-8080}
#
# 说明：compose 会自动读取与本文件同目录的 .env，
# 因此不需要每次都手写 --env-file（少一个容易漏的参数）。
#
# 清理：
#   docker compose -f deploy/docker/docker-compose.yml down -v --rmi local

name: ${ARKADE_PROJECT_NAME:-arkade-debug}

services:
  hub:
    build:
      # 构建上下文是仓库根目录：hub 依赖共享的 protocol 模块，且要打包前端产物。
      context: ../..
      dockerfile: hub/Dockerfile
      args:
        VERSION: ${ARKADE_VERSION:-0.1.0}
    image: ${ARKADE_HUB_IMAGE:-arkade-hub:debug}
    container_name: ${ARKADE_HUB_CONTAINER:-arkade-hub-debug}
    restart: ${ARKADE_RESTART_POLICY:-unless-stopped}
    ports:
      - "${ARKADE_HUB_PORT:-8080}:8080"
    # env_file 与 environment 的分工：
    #   env_file 把 .env 里的全部键值注入容器（新增变量无需改本文件也能进容器）；
    #   environment 用 ${VAR:?...} 在宿主侧做必填校验，缺凭据时直接拒绝启动。
    env_file:
      - .env
    environment:
      # ---- 必填凭据 ----
      ARKADE_INITIAL_PASS: ${ARKADE_INITIAL_PASS:?必须在 deploy/docker/.env 里设置 ARKADE_INITIAL_PASS}
      ARKADE_AGENT_TOKEN: ${ARKADE_AGENT_TOKEN:?必须在 deploy/docker/.env 里设置 ARKADE_AGENT_TOKEN}
      # ---- 可调项 ----
      # 容器内必须监听 0.0.0.0 才能被端口映射访问，因此这里显式覆盖配置文件的默认值。
      ARKADE_LISTEN: ${ARKADE_HUB_LISTEN:-0.0.0.0:8080}
      # 会话有效期，支持 30m / 24h / 72h 这类写法。
      ARKADE_SESSION_TTL: ${ARKADE_SESSION_TTL:-72h}
      # 日志级别与格式（debug/info/warn/error，text/json）。
      ARKADE_LOG_LEVEL: ${ARKADE_LOG_LEVEL:-info}
      ARKADE_LOG_FORMAT: ${ARKADE_LOG_FORMAT:-text}
    volumes:
      - hub-data:/data
      - ./hub.config.toml:/data/config.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: ${ARKADE_HEALTH_INTERVAL:-10s}
      timeout: ${ARKADE_HEALTH_TIMEOUT:-3s}
      start_period: ${ARKADE_HEALTH_START_PERIOD:-10s}
      retries: ${ARKADE_HEALTH_RETRIES:-5}
    networks:
      - arkade

  agent:
    build:
      context: ../..
      dockerfile: agent/Dockerfile
      args:
        VERSION: ${ARKADE_VERSION:-0.1.0}
    image: ${ARKADE_AGENT_IMAGE:-arkade-agent:debug}
    container_name: ${ARKADE_AGENT_CONTAINER:-arkade-agent-debug}
    restart: ${ARKADE_RESTART_POLICY:-unless-stopped}
    depends_on:
      hub:
        # 等 Hub 真正健康再起 Agent，避免开局进入重连退避循环刷日志。
        condition: service_healthy
    env_file:
      - .env
    environment:
      # ---- 必填凭据 ----
      ARKADE_AGENT_TOKEN: ${ARKADE_AGENT_TOKEN:?必须在 deploy/docker/.env 里设置 ARKADE_AGENT_TOKEN}
      # ---- 可调项 ----
      # 服务器显示名。容器 hostname 就是容器 ID，不显式指定的话每次重建名字都会漂移。
      ARKADE_AGENT_NAME: ${ARKADE_AGENT_NAME:-arkade-debug-node}
      # Hub 地址用服务名 hub，不能写 127.0.0.1（那指向 Agent 容器自身）。
      ARKADE_HUB_URL: ${ARKADE_AGENT_HUB_URL:-ws://hub:8080/agent/connect}
      ARKADE_DATA_DIR: ${ARKADE_AGENT_DATA_DIR:-/opt/arkade/agent}
      # 运行时套接字留空表示自动发现（$DOCKER_HOST → docker.sock → podman.sock）。
      ARKADE_SOCKET: ${ARKADE_AGENT_SOCKET:-}
      ARKADE_RUNTIME_KIND: ${ARKADE_AGENT_RUNTIME_KIND:-auto}
      # 兜底心跳间隔；Hub 在握手应答里给出值后以其为准。
      ARKADE_HEARTBEAT_SEC: ${ARKADE_AGENT_HEARTBEAT_SEC:-15}
      ARKADE_LOG_LEVEL: ${ARKADE_LOG_LEVEL:-info}
      ARKADE_LOG_FORMAT: ${ARKADE_LOG_FORMAT:-text}
    volumes:
      # 只读挂载外部编排根目录（宝塔、手写的 compose 项目都在这里）。
      #
      # 为什么需要：Agent 是容器，看不到宿主机路径；而已有项目的配置路径来自
      #   容器标签 com.docker.compose.project.config_files（例如宝塔的
      #   /www/server/panel/data/compose/<项目>/docker-compose.yaml）。
      #   不挂进来就只能在 Arkade 里看到容器、看不到原始配置，
      #   也就无法「宝塔照旧管、Arkade 也能读」。
      #
      # 为什么用目录变量而不是直接写 /: 只挂根目录会让**整台宿主机文件系统**
      #   进入 Agent 容器。默认不挂，按需指定一个目录；挂载始终只读。
      #
      # ============================ 顺序有讲究 ============================
      # 实测（Docker 29 + bind 挂载）：只要 Agent 自己的数据卷与这份挂载
      # 处于**嵌套/覆盖**关系，靠后的挂载会遮掉靠前的那个目录——表现为
      # 数据目录里看不到 agent_id、或者挂进来的外部目录是空的。
      # 因此这里：
      #   1. 先把宿主目录挂到与 Agent 数据目录完全不重叠的 /arkade/external；
      #   2. 再挂数据卷与配置文件。
      # 运行时会把容器标签里的宿主路径换算成 /arkade/external/... 去读。
      # 空值 = compose 对这一项报错，因此默认给一个不存在的占位目录；
      #   需要挂载时务必在 .env 里改成真实目录。
      - type: bind
        source: ${ARKADE_COMPOSE_SOURCE_ROOT:-/var/empty/arkade-no-compose-root}
        target: /arkade/external
        read_only: true
      - agent-data:/opt/arkade/agent
      - ./agent.config.toml:/opt/arkade/agent/agent.toml:ro
      # 挂载宿主机 Docker 套接字：Agent 必须通过它操作本机容器。
      # 这是调试专用的「同机自管」形态，生产环境不会这样部署。
      - ${ARKADE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      - arkade

volumes:
  hub-data:
    name: ${ARKADE_HUB_VOLUME:-arkade-debug-hub-data}
  agent-data:
    name: ${ARKADE_AGENT_VOLUME:-arkade-debug-agent-data}

networks:
  arkade:
    name: ${ARKADE_NETWORK:-arkade-debug-net}
