# Arkade 主节点编排（只跑 Hub）
#
# 【镜像来源】直接拉 CI 构建并推送到 GitHub Container Registry 的镜像：
#   ghcr.io/ayflying/arkade-hub:latest
#   来源工作流 .github/workflows/images.yml（master 推送发 latest + sha-<提交号>）。
#   生产建议固定摘要或 sha- 标签，不要跟 latest 漂移：
#     image: ghcr.io/ayflying/arkade-hub@sha256:<digest>
#   本地想自己构建，用 --build 显式覆盖即可（见下方用法）。
#
# 【编排规范】
#   - 只有凭据类（密码、令牌）走 `${VAR:?}` 从根目录 .env 读取，不落进本文件；
#   - 其余普通参数（端口、名字、日志级别等）直接写在这里，一眼可见，不绕 .env。
#
# 【安全边界】Hub 是控制面，**不直接操作任何机器的 Docker**，因此本文件
#   - 不挂载 /var/run/docker.sock；
#   - 不包含 agent 服务，也不装 docker CLI。
#   容器操作全部由被管服务器上的 Agent 执行（见 agent-compose.yml）。
#   谁需要管本机容器，就在**那台机器**上另外部署一份 agent-compose.yml。
#
# 用法（在仓库根目录）：
#   cp deploy/docker/.env.example .env    # 复制到仓库根目录，只填两个凭据
#   docker compose -f deploy/docker/hub-compose.yml pull
#   docker compose -f deploy/docker/hub-compose.yml up -d
#   浏览器打开 http://<机器IP>:8080
#
#   本地源码构建（不拉 CI 镜像）：
#   docker compose -f deploy/docker/hub-compose.yml up -d --build
#
# 说明：compose 只读取「项目目录」的 .env，本项目目录是仓库根目录，
# 所以凭据文件是 <仓库根目录>/.env；与 agent-compose.yml 的 .env 互不影响。
#
# 清理：
#   docker compose -f deploy/docker/hub-compose.yml down -v --rmi local

name: arkade-hub

services:
  hub:
    # CI 发布的 Hub 镜像（内含编译好的前端产物，多架构 amd64/arm64）。
    image: ghcr.io/ayflying/arkade-hub:latest
    # 保留 build 段：只有显式加 --build 才会本地构建，平时的 pull/up 用上面那个镜像。
    build:
      # 构建上下文是仓库根目录：hub 依赖共享的 protocol 模块，且要打包前端产物。
      context: ../..
      dockerfile: hub/Dockerfile
      args:
        VERSION: ${ARKADE_VERSION:-0.1.0}
    container_name: arkade-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      # 相对 compose 文件所在目录查找；不存在时 compose 会报错，因此要先按上方用法创建。
      - ../../.env
    environment:
      # ---- 必填凭据（唯一需要外部提供的两项）----
      ARKADE_INITIAL_PASS: ${ARKADE_INITIAL_PASS:?必须在仓库根目录 .env 里设置 ARKADE_INITIAL_PASS}
      # Hub 侧保存的就是「Agent 准入令牌」，两侧必须一致。
      ARKADE_AGENT_TOKEN: ${ARKADE_AGENT_TOKEN:?必须在仓库根目录 .env 里设置 ARKADE_AGENT_TOKEN}
      # ---- 普通参数：直接写值 ----
      # 容器内必须监听 0.0.0.0 才能被端口映射访问。
      ARKADE_LISTEN: 0.0.0.0:8080
      # 会话有效期，支持 30m / 24h / 72h 这类写法。
      ARKADE_SESSION_TTL: 72h
      ARKADE_LOG_LEVEL: info
      ARKADE_LOG_FORMAT: text
    volumes:
      # 只有数据库卷与配置文件。没有任何宿主套接字，Hub 想碰 Docker 也碰不到。
      - hub-data:/data
      - ./hub.config.toml:/data/config.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - arkade

volumes:
  hub-data:
    name: arkade-hub-data

networks:
  arkade:
    name: arkade-hub-net
