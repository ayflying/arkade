# Hub + PostgreSQL 独立部署；服务器仅需本文件和 .env。
# 仅用于全新 PostgreSQL，不读取旧 SQLite；使用支持 PG 的新 Hub 镜像。
name: arkade-hub

services:
  hub:
    image: ayflying/arkade-hub:latest
    container_name: arkade-hub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      # 固定的容器内端口/路径与健康检查、数据卷保持一致；普通配置直接修改本文件。
      ARKADE_LISTEN: 0.0.0.0:8080
      ARKADE_DB_HOST: postgres
      ARKADE_DB_PORT: "5432"
      ARKADE_DB_USER: arkade
      ARKADE_DB_NAME: arkade
      ARKADE_DB_PASSWORD: ${ARKADE_DB_PASSWORD:?请在 .env 设置 PostgreSQL 密码}
      ARKADE_DB_SSLMODE: disable
      ARKADE_SETTINGS_KEY_FILE: /data/settings.key
      ARKADE_WEB_DIST: /app/web/dist
      ARKADE_INITIAL_USER: admin
      ARKADE_INITIAL_PASS: ${ARKADE_INITIAL_PASS:?请在 .env 设置管理员初始密码}
      # 远程节点在后台创建专属接入密钥，全局共享准入默认关闭。
      ARKADE_AGENT_TOKEN: ""
      ARKADE_LOCAL_ENABLED: "true"
      ARKADE_LOCAL_DATA_DIR: /opt/arkade/agent
      ARKADE_LOCAL_RUNTIME: auto
      ARKADE_LOCAL_ENDPOINT: /var/run/docker.sock
      ARKADE_LOCAL_COMPOSE_BIN: docker
      ARKADE_BASE_URL: http://127.0.0.1:8080
      ARKADE_LOG_LEVEL: info
      # 数据库内的网页会话策略优先；此项仅供内部旧配置回退。
      ARKADE_SESSION_TTL: 24h
    volumes:
      - hub-data:/data
      - agent-data:/opt/arkade/agent
      # 本机执行面需要宿主高权限；只做控制中心时关闭 LOCAL_ENABLED 并删除此挂载。
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - arkade

  postgres:
    image: postgres:17-alpine
    container_name: arkade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkade
      POSTGRES_DB: arkade
      POSTGRES_PASSWORD: ${ARKADE_DB_PASSWORD:?请在 .env 设置 PostgreSQL 密码}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkade -d arkade"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - arkade

volumes:
  hub-data:
    name: arkade-hub-files-pg
  postgres-data:
    name: arkade-postgres-data
  agent-data:
    # 与历史同机 Agent 保持一致，升级复用身份和工作目录。
    name: arkade-agent-data

networks:
  arkade:
    name: arkade-hub-net
