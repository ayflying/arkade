# Arkade Agent 容器内配置
#
# 【重要】本文件只提供「容器内路径」这类无法用环境变量表达的内置默认值。
# 所有可调项都由 docker-compose.yml 里的 ${ARKADE_*} 环境变量覆盖，
# 改配置请改 .env，不要改这里。
#
# 关键点：hub_url 必须用**服务名** hub，而不是 127.0.0.1。
# 在 compose 网络里 127.0.0.1 指的是 Agent 自己的容器，连不上 Hub。
# 实际值由 ARKADE_HUB_URL 覆盖。

hub_url = "ws://hub:8080/agent/connect"
# 令牌必须留空：由 ARKADE_AGENT_TOKEN 注入，避免明文落盘。
token = ""

# 服务器显示名。容器 hostname 就是容器 ID，不显式指定的话每次重建名字都会漂移，
# Hub 上同一台服务器会显示成不同的名字。由 ARKADE_AGENT_NAME 覆盖。
name = "arkade-debug-node"

# Agent 身份与数据目录（挂卷持久化，重启后复用同一个 agent_id）。
# 由 ARKADE_DATA_DIR 覆盖。
data_dir = "/opt/arkade/agent"

# 运行时自动发现：容器内挂载了 /var/run/docker.sock，会被识别为 Docker。
# 由 ARKADE_SOCKET / ARKADE_RUNTIME_KIND 覆盖，留空即自动探测。
runtime_kind = "auto"

# 以下均由环境变量覆盖，此处仅作本地直跑的默认值。
heartbeat_sec = 15
log_level = "info"
log_format = "text"
insecure_tls = false
