# Hub 内置本机执行面 + PostgreSQL：两个独立容器。
# Hub 单数据卷 /data（settings.key + local），数据库独立持久化。
name: arkade

services:
  hub:
    image: ayflying/arkade-hub:latest
    container_name: arkade-hub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      LISTEN: 0.0.0.0:8080
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: arkade
      DB_NAME: arkade
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 PostgreSQL 密码}
      DB_SSLMODE: disable
      SETTINGS_KEY_FILE: /data/settings.key
      WEB_DIST: /app/web/dist
      INITIAL_USER: admin
      INITIAL_PASS: ${INITIAL_PASS:?请在 .env 设置管理员初始密码}
      # 内置本机无需令牌；远程节点通过后台创建专属接入密钥。
      AGENT_TOKEN: ""
      LOCAL_ENABLED: "true"
      LOCAL_DATA_DIR: /data/local
      LOCAL_RUNTIME: auto
      LOCAL_ENDPOINT: /var/run/docker.sock
      LOCAL_COMPOSE_BIN: docker
      BASE_URL: http://127.0.0.1:8080
      # 可选外部 WebSocket 路径前缀，仅在反代转发时会剥离该前缀的场景使用。
      AGENT_CONNECT_PREFIX: ""
      LOG_LEVEL: info
    volumes:
      - hub-data:/data
      # 等价于宿主高权限；仅控制中心模式需关闭本机并删除此挂载。
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - arkade

  postgres:
    image: postgres:17-alpine
    container_name: arkade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arkade
      POSTGRES_DB: arkade
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 PostgreSQL 密码}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkade -d arkade"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - arkade

volumes:
  hub-data:
    name: arkade-hub-data
  postgres-data:
    name: arkade-postgres-data

networks:
  arkade:
    name: arkade-hub-net
