# Hub + Agent 同机部署：一个 Compose 项目，两个独立容器。
# 本文件包含完整配置，无需其他编排；Agent 专属密钥不能复用 Hub 准入令牌。
name: arkade

services:
  hub:
    image: ghcr.io/ayflying/arkade-hub:latest
    container_name: arkade-hub
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      ARKADE_LISTEN: 0.0.0.0:8080
      ARKADE_DB_PATH: /data/hub.db
      ARKADE_WEB_DIST: /app/web/dist
      ARKADE_INITIAL_USER: admin
      ARKADE_INITIAL_PASS: ${ARKADE_INITIAL_PASS:?请在 .env 设置管理员初始密码}
      ARKADE_AGENT_TOKEN: ${ARKADE_AGENT_TOKEN:?请在 .env 设置 Hub 准入令牌}
      ARKADE_BASE_URL: http://127.0.0.1:8080
      ARKADE_LOG_LEVEL: info
      # 数据库内的网页会话策略优先；此项仅供内部旧配置回退。
      ARKADE_SESSION_TTL: 24h
    volumes:
      - hub-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    networks:
      - arkade

  agent:
    image: ghcr.io/ayflying/arkade-agent:latest
    container_name: arkade-agent
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      ARKADE_AGENT_TOKEN: ${ARKADE_LOCAL_AGENT_TOKEN:-}
      # 同网络通过服务名连接，不能使用指向 Agent 自身的 127.0.0.1。
      ARKADE_HUB_URL: ws://hub:8080/agent/connect
      ARKADE_AGENT_NAME: arkade-node
      ARKADE_DATA_DIR: /opt/arkade/agent
      ARKADE_SOCKET: /var/run/docker.sock
      ARKADE_RUNTIME_KIND: auto
      ARKADE_HEARTBEAT_SEC: 15
      ARKADE_LOG_LEVEL: info
      ARKADE_LOG_FORMAT: text
    volumes:
      - agent-data:/opt/arkade/agent
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - arkade

volumes:
  hub-data:
    name: arkade-hub-data
  agent-data:
    name: arkade-agent-data

networks:
  arkade:
    name: arkade-hub-net
